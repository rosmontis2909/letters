<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>一封信</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#e9e3d8;
    background-image:radial-gradient(1200px 600px at 50% -20%, #f2ece1 0%, #e9e3d8 45%, #ded6c8 100%);
    background-attachment:fixed;
    color:#2c2a27;
    font-family:Georgia,"Source Han Serif SC","Noto Serif CJK SC","Songti SC",SimSun,serif;
    -webkit-font-smoothing:antialiased;
    line-height:2.05;
    padding:6vh 18px 8vh;
  }

  /* ---------- 门口 ---------- */
  #gate{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#f2ece1 0%,#e9e3d8 65%,#ded6c8 100%);
    padding:24px;
    transition:opacity .7s ease, visibility .7s;
  }
  #gate.gone{opacity:0;visibility:hidden}
  .gate-box{max-width:330px;width:100%;text-align:center}
  .gate-seal{
    width:54px;height:54px;margin:0 auto 28px;
    border:1px solid rgba(120,100,75,.35);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:#a3937b;letter-spacing:0;
  }
  .gate-box p{
    margin:0 0 24px;color:#7a6f5f;font-size:15px;
    letter-spacing:.04em;line-height:2;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .gate-form{display:flex;gap:8px}
  #pass{
    flex:1;background:rgba(255,253,248,.7);
    border:1px solid rgba(120,100,75,.25);
    border-radius:6px;padding:11px 13px;
    color:#2c2a27;font-size:15px;font-family:inherit;outline:none;
    transition:border-color .25s, background .25s;
  }
  #pass:focus{border-color:rgba(120,100,75,.55);background:#fffdf8}
  #pass::placeholder{color:#b3a795}
  .gate-form button{
    background:rgba(120,100,75,.08);border:1px solid rgba(120,100,75,.28);
    color:#6b6252;border-radius:6px;padding:0 20px;font-size:15px;
    font-family:inherit;cursor:pointer;transition:.25s;
  }
  .gate-form button:hover{background:rgba(120,100,75,.16)}
  #hint{margin:16px 0 0;font-size:13px;color:#a35c4a;min-height:18px;
        font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  #hint.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- 信纸 ---------- */
  .paper{
    display:none;
    max-width:660px;margin:0 auto;
    background:#fffdf8;
    padding:68px 62px 76px;
    box-shadow:
      0 1px 1px rgba(80,60,40,.06),
      0 8px 24px rgba(80,60,40,.08),
      0 30px 70px -20px rgba(80,60,40,.16);
    border-radius:2px;
    position:relative;
  }
  .paper.show{display:block;animation:fade .9s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .paper::before{
    content:"";
    position:absolute;inset:14px;
    border:1px solid rgba(120,100,75,.10);
    pointer-events:none;
  }

  .stamp{
    text-align:right;
    font-size:12.5px;
    letter-spacing:.18em;
    color:#a3937b;
    margin:0 0 46px;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }

  article p{margin:0 0 1.5em;font-size:17px;letter-spacing:.01em}
  article p:last-child{margin-bottom:0}

  article blockquote{
    margin:2em 0;padding:0 0 0 20px;
    border-left:2px solid rgba(163,147,123,.35);
    color:#57514a;font-size:16.5px;
  }
  article blockquote p{margin:0 0 .8em;font-size:16.5px}
  article blockquote p:last-child{margin-bottom:0}

  article hr{
    border:0;height:1px;background:rgba(120,100,75,.16);
    margin:2.8em auto;width:38%;
  }

  .end{
    margin:3.4em 0 0;
    text-align:right;
    font-size:16.5px;
    color:#3a3630;
    line-height:1.9;
  }

  .empty-tip{
    color:#a3937b;font-size:15px;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    text-align:center;padding:40px 0;
  }

  @media (max-width:680px){
    body{padding:0 0 40px}
    .paper{padding:44px 26px 56px;box-shadow:none;border-radius:0}
    .paper::before{inset:10px}
    article p{font-size:16.5px}
    .stamp{margin-bottom:32px}
  }
</style>
</head>
<body>

<!-- 门口 -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-seal">✉</div>
    <p>这封信只写给一个人，<br>好久不见。</p>
    <form class="gate-form" autocomplete="off">
      <input id="pass" type="text" placeholder="口令" aria-label="口令" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="submit">拆</button>
    </form>
    <p id="hint"></p>
  </div>
</div>

<div class="paper" id="paper">
  <p class="stamp">2026 &nbsp;·&nbsp; 11 &nbsp;·&nbsp; 24</p>

  <article>
    <p>测试</p>
  </article>

  <div class="end">

  </div>
</div>

<script>
  (function(){
    var KEY = "m4k9";

    var gate   = document.getElementById('gate');
    var paper  = document.getElementById('paper');
    var input  = document.getElementById('pass');
    var hint   = document.getElementById('hint');
    var form   = document.querySelector('.gate-form');

    function open(){
      gate.classList.add('gone');
      paper.classList.add('show');
      try{ sessionStorage.setItem('b','1'); }catch(e){}
    }

    try{
      if(sessionStorage.getItem('b') === '1'){ open(); }
    }catch(e){}

    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var v = (input.value || '').trim();
      if(v === KEY){
        hint.textContent = '';
        open();
      }else{
        hint.textContent = '不是这个。';
        hint.classList.remove('shake');
        void hint.offsetWidth;
        hint.classList.add('shake');
        input.value = '';
        input.focus();
      }
    });

    setTimeout(function(){ input.focus(); }, 400);
  })();
</script>
</body>
</html>
